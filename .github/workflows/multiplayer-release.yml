name: Multiplayer Release

# Clean Release builds of the multiplayer fork for Windows and Linux.
# Pushing a tag like v1.1.0-mp1 starts it (or run it manually from the
# Actions tab); the builds are attached to a draft
# GitHub release so nothing goes public until it is published by hand.
on:
  push:
    tags:
      - "v*-mp*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0-mp1)"
        required: true

env:
  # No shared binary cache: every dependency is built from source.
  VCPKG_BINARY_SOURCES: "clear"
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: "Build Windows x64"
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Get AV
        uses: actions/checkout@v4
      - name: Configure CMake
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DYML=YML
      - name: Build AV
        run: cmake --build build --config Release --parallel "$env:NUMBER_OF_PROCESSORS"
      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix ./
          New-Item -ItemType Directory pkg/ArrowVortex | Out-Null
          Copy-Item -Recurse bin/assets, bin/noteskins, bin/settings, bin/ArrowVortex.exe pkg/ArrowVortex/
          Compress-Archive pkg/ArrowVortex ArrowVortex-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ArrowVortex-windows-x64.zip
          if-no-files-found: error

  linux:
    name: "Build Linux x64"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get AV
        uses: actions/checkout@v4
      - name: Install dependent packages
        run: |
          sudo apt-get update &&
          sudo apt-get install -qq -y nasm libltdl-dev \
            autoconf autoconf-archive automake libtool \
            libx11-dev libxft-dev libxext-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libibus-1.0-dev zenity clang-tidy build-essential git \
            pkg-config cmake ninja-build libasound2-dev libpulse-dev \
            libaudio-dev libjack-dev libsndio-dev libusb-1.0-0-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev fcitx-libs-dev libdecor-0-dev python3-venv \
            libthai-dev libpipewire-0.3-dev liburing-dev
      - name: Configure CMake
        run: >
          cmake -Bbuild -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DPRESET_NAME=linux-release
          -DYML=YML
      - name: Build AV
        run: cmake --build build --config Release --parallel $(nproc)
      - name: Package
        # tar keeps the executable bit, which upload-artifact drops.
        run: |
          cmake --install build --config Release --prefix ./
          mkdir -p pkg/ArrowVortex
          cp -r bin/assets bin/noteskins bin/settings bin/ArrowVortex pkg/ArrowVortex/
          tar -C pkg -czf ArrowVortex-linux-x64.tar.gz ArrowVortex
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ArrowVortex-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: "Draft release"
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ArrowVortex Together ${{ env.RELEASE_TAG }}
          draft: true
          files: dist/*
